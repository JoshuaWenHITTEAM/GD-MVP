apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: gd-docker-track-build

build:
  tagPolicy:
    inputDigest: {}
  local:
    push: false
    useDockerCLI: true
    useBuildkit: true
  artifacts:
    - image: gd-docker-track
      context: .
      docker:
        dockerfile: runtime.Dockerfile
      hooks:
        after:
          - command: ["sh", "-c", "./after_build_update.sh"]
            os: [darwin, linux]

profiles:
  - name: minikube
    activation:
      - kubeContext: minikube
