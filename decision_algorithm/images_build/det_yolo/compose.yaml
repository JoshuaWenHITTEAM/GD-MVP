services:
  infer-runtime:
    build:
      context: .
      dockerfile: runtime.base.Dockerfile
    container_name: antiuav-det-yolo-runtime
    gpus: all
    working_dir: /workspace
    command: >
      uvicorn app.server:app
      --host 0.0.0.0
      --port 9000
      --reload
      --reload-dir /workspace/app
    ports:
      - "8004:9000"
    environment:
      YOLO_CONF: "0.55"
      YOLO_IOU: "0.45"
      YOLO_IMGSZ: "1280"
      YOLO_MAX_DET: "300"
      YOLO_TARGET_CLASSES: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      WEIGHT_ROOT: /models
    volumes:
      - ./app:/workspace/app
      - ./models:/models:ro
