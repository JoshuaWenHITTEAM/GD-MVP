services:
  infer-runtime:
    build:
      context: .
      dockerfile: runtime.base.Dockerfile
    container_name: track-advi-runtime-dev
    gpus: all
    working_dir: /workspace
    command: >
      uvicorn app.server:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /workspace/app
      --reload-dir /workspace/lib
      --reload-dir /workspace/configs
    ports:
      - "8002:8000"
    environment:
      TRACK_ADVI_MIN_SCORE: "0.55"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./app:/workspace/app
      - ./lib:/workspace/lib
      - ./configs:/workspace/configs
      - ./models:/models:ro
