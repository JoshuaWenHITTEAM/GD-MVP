      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /workspace/app
    ports:
      - "8001:8000"
    environment:
      RTDETR_CONF: "0.25"
      RTDETR_IOU: "0.45"
      RTDETR_IMGSZ: "640"
      RTDETR_MAX_DET: "300"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      WEIGHT_ROOT: /models
    volumes:
      - ./det_redetr/app:/workspace/app
      - ./det_redetr/models:/models:ro

