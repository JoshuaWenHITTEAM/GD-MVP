services:
  infer-runtime:
    build:
      context: .
      dockerfile: runtime.Dockerfile
    container_name: infer-runtime-dev
    working_dir: /workspace
    command: >
      uvicorn app.server:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /workspace/app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/workspace/app
      - ./models:/models:ro